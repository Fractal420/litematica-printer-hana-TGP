name: 功能建议
description: 提议与投影打印、建造或物品管理直接相关的新功能
title: "[功能建议] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先说明要解决的问题，而不只是描述一个按钮或开关。尚未成形的想法可以先在 [Discussions](https://github.com/Yur1Ca/litematica-printer/discussions) 中讨论。

  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前确认
      options:
        - label: 我已经搜索过现有 Issues 和 Discussions，确认没有相同建议。
          required: true
        - label: 这个建议与 Litematica Printer 的打印、扫描、建造或物品管理目标直接相关。
          required: true
        - label: 这不是单纯的使用帮助或配置问题。
          required: true

  - type: dropdown
    id: module
    attributes:
      label: 涉及的功能
      options:
        - 打印/方块放置
        - 扫描器/迭代器/缓存
        - 挖掘/填充/排流体
        - 破基岩
        - Quick Shulker/Take It Out
        - HUD/界面
        - 配置/快捷键
        - 模组兼容
        - 新功能模块
        - 其他
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 需要解决的问题
      description: 当前流程有什么不足，会在什么场景影响使用？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述功能行为、触发方式、配置项，以及用户能够观察到的结果。
    validations:
      required: true

  - type: textarea
    id: use_case
    attributes:
      label: 实际使用场景
      description: 请给出一个具体例子，说明该功能解决问题的完整过程。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 尝试过的替代方法
      description: 是否能通过现有设置、其他操作流程或兼容模组实现？它们为什么不够？

  - type: textarea
    id: risks
    attributes:
      label: 性能、兼容性或安全影响
      description: 如果可能影响扫描性能、主线程、服务器限制、物品安全或其他功能，请说明你的预期。

  - type: textarea
    id: references
    attributes:
      label: 参考资料
      description: 可以附上截图、视频、相关实现或协议资料。请解释参考内容，不要只留下链接。

  - type: checkboxes
    id: final_confirmation
    attributes:
      label: 最后确认
      options:
        - label: 我理解提交建议不代表一定会实现，最终方案也可能根据性能和兼容性要求调整。
          required: true
